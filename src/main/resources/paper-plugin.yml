name: Cigarette
version: ${version}
main: dev.stamchuk.cigarette.Cigarette
api-version: "1.21"
authors: [Stamchuk, StamStudio]
website: https://stamstudio.org
folia-supported: false

permissions:
  cigarette.use:
    default: true
    description: Allows smoking cigarettes and viewing own stats
  cigarette.give:
    default: op
    description: Allows giving cigarettes to players
  cigarette.admin:
    default: op
    description: Allows reload, addiction lookup and reset
